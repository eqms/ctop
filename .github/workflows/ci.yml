name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.8.0)'
        required: false
        type: string

# Default to read-only; jobs that publish (release, docker, homebrew)
# request write access individually.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'

      - name: Run tests
        run: go test ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          args: --timeout=5m

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=$(cat VERSION)
          BUILD=$(git rev-parse --short HEAD)
          go build -tags release \
            -ldflags "-w -X main.version=${VERSION} -X main.build=${BUILD}" \
            -o ctop-${VERSION}-${{ matrix.suffix }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctop-${{ matrix.suffix }}
          path: ctop-*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine tag
        id: tag
        env:
          # Pass the dispatch input via env to avoid shell injection from
          # ${{ }} interpolation inside run: blocks.
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$TAG_INPUT" ]; then
            echo "tag=$TAG_INPUT" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          pattern: ctop-*

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ctop-* > sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true

  docker:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        env:
          # Pass the dispatch input via env to avoid shell injection from
          # ${{ }} interpolation inside run: blocks.
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$TAG_INPUT" ]; then
            echo "version=${TAG_INPUT#v}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          pattern: ctop-*

      - name: Update Homebrew formula
        run: |
          VERSION=$(cat VERSION)
          cd artifacts
          SHA_DARWIN_ARM64=$(sha256sum ctop-*-darwin-arm64 | awk '{print $1}')
          SHA_DARWIN_AMD64=$(sha256sum ctop-*-darwin-amd64 | awk '{print $1}')
          SHA_LINUX_ARM64=$(sha256sum ctop-*-linux-arm64 | awk '{print $1}')
          SHA_LINUX_AMD64=$(sha256sum ctop-*-linux-amd64 | awk '{print $1}')
          cd ..

          FORMULA=homebrew-tap/Formula/ctop.rb
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"
          sed -i "/darwin-arm64/{n;s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA_DARWIN_ARM64}\"/}" "$FORMULA"
          sed -i "/darwin-amd64/{n;s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA_DARWIN_AMD64}\"/}" "$FORMULA"
          sed -i "/linux-arm64/{n;s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA_LINUX_ARM64}\"/}" "$FORMULA"
          sed -i "/linux-amd64/{n;s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA_LINUX_AMD64}\"/}" "$FORMULA"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add homebrew-tap/Formula/ctop.rb
          git diff --cached --quiet || git commit -m "[CHG] Update Homebrew formula to $(cat VERSION)"
          git push
